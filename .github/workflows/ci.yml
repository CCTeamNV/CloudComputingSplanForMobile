name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*'] # release: deploy to prod after approval in the GitHub environment (ADR 0005)

permissions:
  contents: read
  id-token: write # OIDC to AWS, no access keys (ADR 0005)

# Explicit bash runs with -o pipefail, so `terraform plan | tee` fails when plan fails.
defaults:
  run:
    shell: bash

env:
  TF_VERSION: 1.16.4
  AWS_REGION: eu-central-1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck --workspaces
      - run: npm test --workspaces
      - run: npm run build -w frontend
      - name: API types match docs/api.yaml
        run: npm run gen:api -w frontend && git diff --exit-code frontend/src/api/schema.d.ts

  plan:
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        account: ${{ fromJSON(vars.AWS_ACCOUNT_IDS) }}
        env: [dev, prod]
    defaults:
      run:
        working-directory: infra/envs/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build -w backend
        working-directory: .
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::${{ matrix.account }}:role/splan-gha-plan
          aws-region: ${{ env.AWS_REGION }}
      - run: terraform fmt -check -recursive ../..
      - run: terraform init -input=false -backend-config="bucket=splan-tfstate-${{ matrix.account }}"
      - run: terraform plan -input=false -no-color | tee plan.txt
      - name: Plan to job summary
        if: always()
        run: |
          {
            echo "### terraform plan ${{ matrix.env }} (${{ matrix.account }})"
            echo '```'
            tail -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # main -> dev; tag v* -> prod. The apply role trusts only jobs in its GitHub environment, whose rules allow only
  # main (dev) or tags v* with approval (prod), see infra/bootstrap/README.md.
  deploy:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ github.ref_type == 'tag' && 'prod' || 'dev' }}
    env:
      ENV: ${{ github.ref_type == 'tag' && 'prod' || 'dev' }}
    strategy:
      fail-fast: false
      matrix:
        account: ${{ fromJSON(vars.AWS_ACCOUNT_IDS) }}
    concurrency:
      group: deploy-${{ github.ref_type == 'tag' && 'prod' || 'dev' }}-${{ matrix.account }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: infra/envs/${{ github.ref_type == 'tag' && 'prod' || 'dev' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build -w backend && npm run build -w frontend
        working-directory: .
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::${{ matrix.account }}:role/splan-gha-apply-${{ env.ENV }}
          aws-region: ${{ env.AWS_REGION }}
      - run: terraform init -input=false -backend-config="bucket=splan-tfstate-${{ matrix.account }}"
      - run: terraform apply -input=false -auto-approve
      - name: Upload frontend
        # config.json stays as written by Terraform. shortcut: no --delete, old hashed assets stay so open tabs keep working; clean up if the bucket grows.
        # shortcut: icons in public/ are unhashed but cached as immutable; give them a new name if they change.
        run: |
          BUCKET="$(terraform output -raw frontend_bucket)"
          aws s3 sync ../../../frontend/dist "s3://$BUCKET" --exclude config.json --exclude index.html \
            --exclude manifest.webmanifest --cache-control "public,max-age=31536000,immutable"
          aws s3 cp ../../../frontend/dist/index.html "s3://$BUCKET/index.html" --cache-control "no-cache"
          # Unhashed name: must not be cached as immutable; S3 does not know the type of .webmanifest.
          aws s3 cp ../../../frontend/dist/manifest.webmanifest "s3://$BUCKET/manifest.webmanifest" \
            --cache-control "no-cache" --content-type "application/manifest+json"
      - name: Smoke test
        run: |
          curl --fail --silent --show-error --retry 3 "$(terraform output -raw api_url)/health"
          curl --fail --silent --show-error --retry 3 -o /dev/null "$(terraform output -raw frontend_url)/courses"
          curl --fail --silent --show-error --retry 3 "$(terraform output -raw frontend_url)/config.json"
